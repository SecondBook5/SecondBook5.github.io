    details: |
      Completed August 2026. GPA: 4.0.

      Master's thesis: *StageBridge: Niche-Conditioned Regulatory Transport in Premalignant Epithelial Progression*.

      Advisor: Chris Bradburne, PhD, Associate Professor, Department of Genetic Medicine, Johns Hopkins University.

      Code and reproducible workflow: [CRRT-UDE](https://github.com/SecondBook5/crrt-ude).

      Selected coursework: Advanced Genomics; Gene Expression Analysis; Systems Biology; Deep Learning Using Transformers; Epigenetics; Cellular Signal Transduction.

