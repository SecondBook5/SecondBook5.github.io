career-profile:
  title: Bio
  summary: |
    I am a computational biologist at Memorial Sloan Kettering Cancer Center studying how regulatory programs, immune state, and tissue context shape cell-state transitions. My work combines single-cell and spatial omics, quantitative imaging, genomics, and mechanistic machine learning.

    My M.S. thesis in Bioinformatics at Johns Hopkins University developed [CRRT-UDE](https://github.com/SecondBook5/crrt-ude), a structured framework for estimating niche-conditioned regulatory transport from cross-sectional tissue data. I am extending this direction through research on premalignant progression, systemic immune architecture, and interpretable models of biological change.
current-focus:
  title: Current focus
  items:
  - title: Spatial regulatory dynamics
    description: >
      I develop models of how local tissue context alters cell-state transitions,
      centered on CRRT-UDE and its evaluation in lung adenocarcinoma precursor
      progression and pancreatic intraepithelial neoplasia.
  - title: Systems immunology and host biology
    description: >
      I integrate quantitative imaging, immune phenotyping, tumor genomics, and
      clinical outcomes to study thymic reserve and other host determinants of
      treatment response and toxicity.
  - title: Reproducible computational methods
    description: >
      I build auditable workflows for single-cell, imaging, microbiome, and
      cancer-genomics analyses with explicit data contracts, validation, and
      provenance.
projects:
  title: Selected projects
  intro: >
    Selected work spanning spatial regulatory modeling, systems immunology,
    translational analysis, and reproducible research software.
  assignments:
  - title: StageBridge / CRRT-UDE
    link: "https://github.com/SecondBook5/crrt-ude"
    problem: >
      Cross-sectional tissue data obscure how local niche context changes
      epithelial progression.
    contribution: >
      I developed CRRT-UDE to estimate a niche-conditioned context-residual
      field in interpretable regulatory coordinates using stratified optimal
      transport and structured universal differential equations.
    status: >
      Completed M.S. thesis; evaluated in lung adenocarcinoma precursors and
      pancreatic intraepithelial neoplasia; continuing as a research implementation.

  - title: HostBio
    link: "https://github.com/Advanced-Computing-and-Oncology-Lab/HostBio"
    problem: >
      Routine CT and MRI contain host phenotypes that standard tumor-centered
      analyses do not quantify.
    contribution: >
      I am building a cohort-scale platform that combines organ segmentation,
      scan-adaptive tissue-composition modeling, quantitative quality control,
      and clinical-outcome integration.
    status: >
      Active MSK research platform supporting multi-cohort translational studies.

  - title: CellQuorum
    link: "https://github.com/SecondBook5/CellQuorum"
    problem: >
      Single-cell workflows are difficult to reproduce and audit across cohorts
      and computing environments.
    contribution: >
      I built a configuration-driven, GPU-aware workflow engine with validated
      data contracts, provenance tracking, and reproducible core processing.
    status: >
      Beta research software; regulatory-network, communication, and trajectory
      modules are under development.

  - title: Thymus nnUNetv2 Segmentation
    link: "https://github.com/Advanced-Computing-and-Oncology-Lab/Thymus-nnUNetv2-Segmentation"
    problem: >
      Manual thymus delineation prevents scalable radiographic phenotyping in
      thoracic CT cohorts.
    contribution: >
      I developed a five-fold nnUNetv2 framework with standalone inference,
      fold-wise evaluation, quantitative metrics, and multiplanar quality-control
      overlays.
    status: >
      Internal research software and the segmentation backbone for HostBio.

  - title: Secondary Lymphedema Single-Cell Analysis
    link: "https://github.com/SecondBook5/lymphedema_keratinocyte_par2"
    problem: >
      The cellular programs sustaining human secondary lymphedema remain
      incompletely resolved.
    contribution: >
      I perform donor-aware analysis of paired normal and lymphedematous skin
      to characterize epithelial, immune, and stromal remodeling.
    status: >
      PAR2 study published; extended multi-compartment and cross-dataset analyses
      are ongoing.

  - title: Dysbioscope
    link: "https://github.com/SecondBook5/Dysbioscope"
    problem: >
      Microbiome findings often vary across cohorts, processing choices, and
      differential-abundance methods.
    contribution: >
      I built a Snakemake workflow connecting raw 16S processing, dual taxonomic
      classification, compositional inference, cross-cohort concordance, and
      publication-grade visualization.
    status: >
      Active collaboration; code will be released with the associated manuscript.

  - title: Cosmic-IMPACT
    link: "https://github.com/SecondBook5/Cosmic-IMPACT"
    problem: >
      Tissue and cell-free DNA panel outputs are fragmented across specialized
      cancer-genomics tools.
    contribution: >
      I built a unified research toolkit for mutation annotation, genomic burden
      and instability, mutational signatures, clonality, ctDNA estimation, and
      longitudinal clonal summaries.
    status: >
      Beta, research-use-only software undergoing validation and public-release
      preparation.
