experiences:
  title: Experience
  info:
  - role: Research Assistant, Advanced Computing and Oncology Laboratory
    time: Aug 2026 - present
    company: Sloan Kettering Institute, Memorial Sloan Kettering Cancer Center
    details: |
      Drive quantitative study design and computational strategy across translational studies of tumor-host interactions, immune state, treatment response, toxicity, and lung-cancer outcomes.

      - Develop imaging-centered analyses integrating quantitative CT, radiation exposure, tumor genomics, circulating tumor DNA, immune profiling, and longitudinal clinical outcomes.
      - Conceived and developed HostBio / Comp-MRF, a scan-adaptive probabilistic framework for interpretable host-tissue composition from routine CT.
      - Lead analyses linking thymic and body-composition phenotypes with peripheral immune profiling, cytokines, tumor genomics, treatment response, toxicity, and survival.
      - Develop interpretable deep-learning and longitudinal imaging approaches for thoracic imaging and patient-level trajectory analysis.
      - Build reusable computational infrastructure for cancer genomics, imaging, and reproducible translational research.

  - role: Graduate Research Assistant, Advanced Computing and Oncology Laboratory
    time: Mar 2025 - Jul 2026
    company: Sloan Kettering Institute, Memorial Sloan Kettering Cancer Center
    details: |
      Conducted computational and translational research while completing the M.S. in Bioinformatics at Johns Hopkins University, with work spanning quantitative imaging, systems immunology, cancer genomics, and multimodal clinical analysis.

  - role: Medical / Laboratory Assistant
    time: 2023 - 2024
    company: The Center for Skin Surgery, Cornwall, NY
    details: |
      Supported Mohs micrographic surgery workflow, clinical documentation, tissue handling, and dermatopathology preparation for squamous and basal cell carcinoma cases.

      - Prepared frozen tissue sections and H&E-stained slides.
      - Assisted with immunohistochemistry-associated workflows and surgical pathology review preparation.

  - role: Honors Thesis Research
    time: Jan - Jul 2023
    company: Department of Biology, Yeshiva University
    details: |
      Developed a surfaceome-constrained multi-omic target-discovery analysis for head and neck squamous cell carcinoma.

      - Integrated TCGA, CPTAC, GEO, and protein/localization resources to evaluate transcriptomic expression, proteomic evidence, tumor selectivity, immune context, and therapeutic feasibility.
      - Prioritized candidate antibody-drug conjugate targets including B7-H3, MMP14, PTK7, and LRRC15.

  - role: Research Assistant
    time: 2019
    company: Bruckner Oncology, Bronx, NY
    details: |
      Built and maintained a clinical oncology research database, performed retrospective survival analyses, and contributed to peer-reviewed studies of prognostic factors and treatment outcomes in gastrointestinal cancers.

