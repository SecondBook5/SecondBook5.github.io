career-profile:
  title: Bio
  summary: |
    I am a Research Assistant at Memorial Sloan Kettering studying how inflammatory history, aging, and treatment reshape immune and tissue states over time. My imaging-focused work uses quantitative clinical imaging and radiobiology to extract host phenotypes and relate them to immune, genomic, treatment, and outcome data. I also use single-cell and spatial transcriptomics, bulk RNA, proteomics, and microbiome data to study regulatory and tissue-state dynamics.

    I received my M.S. in Bioinformatics from Johns Hopkins University, where I defended *StageBridge: Niche-Conditioned Regulatory Transport in Premalignant Epithelial Progression*. I modeled how tissue context shapes regulatory state transitions during epithelial progression using spatial and single-nucleus transcriptomics, transcription factor activity, and gene regulatory networks.

    Across these problems, I use interpretable deep learning and probabilistic modeling to infer latent biological states from sparse, heterogeneous observations. I am especially interested in biological memory, cell-state transitions, and which computational ideas transfer across modalities, where they break down, and what can be inferred from incomplete data.

current-focus:
  title: Research themes
  items:
  - title: Imaging host biology and radiobiology
    description: >
      I use quantitative clinical imaging to derive host and tissue phenotypes from
      routine scans and relate them to immune state, tumor genomics, radiation exposure,
      treatment response, toxicity, and clinical outcomes.
  - title: Regulatory and tissue-state dynamics
    description: >
      I use single-cell, spatial, transcriptomic, proteomic, and microbiome data to study
      persistent epithelial, stromal, immune, and regulatory states in cancer and
      inflammatory disease.
  - title: Interpretable inference across modalities
    description: >
      I develop interpretable deep-learning and probabilistic approaches for latent
      biological-state inference, with emphasis on biological structure, uncertainty,
      identifiability, and determining which computational ideas transfer across
      measurement modalities and where they fail.

projects:
  title: Selected research
  intro: >
    Selected work spanning quantitative imaging, systems immunology, regulatory biology,
    and inference of dynamic biological processes from sparse human observations.
  assignments:
  - title: HostBio / Comp-MRF
    link:
    problem: >
      Routine clinical scans contain information about host tissue state, but acquisition
      variability and partial-volume effects complicate biological interpretation.
    contribution: >
      I conceived a scan-adaptive probabilistic framework for quantifying interpretable
      host-tissue composition using partial-volume mixture modeling, spatial regularization,
      nuisance-component handling, and within-scan reference tissues. I apply these
      phenotypes to studies of immune state, tumor genomics, treatment response, toxicity,
      and outcomes.
    status: >
      Active MSK research platform supporting multiple lung-cancer cohorts and
      translational studies.

  - title: StageBridge
    link: "https://github.com/SecondBook5/crrt-ude"
    problem: >
      Human disease progression is dynamic, but tissue data are usually sparse and
      cross-sectional, making regulatory transitions only partially observable.
    contribution: >
      For my M.S. thesis, I modeled how local tissue context shapes regulatory state
      transitions during premalignant epithelial progression using spatial and
      single-nucleus transcriptomics, transcription factor activity, gene regulatory
      networks, and context-conditioned transport.
    status: >
      M.S. thesis defended at Johns Hopkins University; methodological and biological
      follow-up is ongoing.

  - title: Secondary Lymphedema Multi-omics
    link: "https://github.com/SecondBook5/lymphedema_keratinocyte_par2"
    problem: >
      Chronic lymphatic dysfunction produces persistent epithelial, stromal, and immune
      remodeling whose regulatory programs remain incompletely resolved.
    contribution: >
      I analyze single-cell and bulk transcriptomic, proteomic, and microbiome data to
      characterize inflammatory tissue states, regulatory programs, and cross-compartment
      remodeling across secondary lymphedema studies.
    status: >
      Work includes peer-reviewed studies and ongoing multi-omic analyses and manuscripts.

