<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.page_title %}{{ page.page_title }} · {% endif %}AJ Book</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="AJ Book home">AJ Book</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/research/' | relative_url }}"{% if page.nav == 'research' %} class="active"{% endif %}>Research</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} class="active"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.nav == 'cv' %} class="active"{% endif %}>CV</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} class="active"{% endif %}>About</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-shell">
      <div>
        <strong>AJ Book</strong><br>
        Research Assistant, Memorial Sloan Kettering Cancer Center
      </div>
      <div class="footer-links">
        <a href="mailto:ajbook12@gmail.com">Email</a>
        <a href="https://github.com/SecondBook5">GitHub</a>
        <a href="https://www.linkedin.com/in/aj-abraham-book/">LinkedIn</a>
        <a href="https://orcid.org/0009-0004-7058-7510">ORCID</a>
      </div>
    </div>
  </footer>
</body>
</html>
